---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - crema.kubebottle.io
  resources:
  - gpuworkspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - crema.kubebottle.io
  resources:
  - gpuworkspaces/finalizers
  verbs:
  - update
- apiGroups:
  - crema.kubebottle.io
  resources:
  - gpuworkspaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - crema.kubebottle.io
  resources:
  - snapshotregistries
  verbs:
  - get
  - list
  - watch
