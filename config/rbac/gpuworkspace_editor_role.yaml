# This rule is not used by the project crema itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the crema.kubebottle.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crema
    app.kubernetes.io/managed-by: kustomize
  name: gpuworkspace-editor-role
rules:
- apiGroups:
  - crema.kubebottle.io
  resources:
  - gpuworkspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - crema.kubebottle.io
  resources:
  - gpuworkspaces/status
  verbs:
  - get
