apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: system
  labels:
    app.kubernetes.io/name: crema-agent
    app.kubernetes.io/part-of: crema
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crema-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crema-agent
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: crema-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - --listen-addr=:9090
            - --containerd-socket=/run/containerd/containerd.sock
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: true
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
