syntax = "proto3";

package crema.agent.v1alpha1;

option go_package = "github.com/kubebottle/crema/internal/agentpb;agentpb";

// CremaAgent runs on each cluster node (DaemonSet) and interacts with containerd
// to capture incremental OCI rootfs layers and publish them to an OCI registry.
service CremaAgent {
  // CommitContainer captures the writable overlayfs delta of a container,
  // compresses it, appends it to the parent OCI image, and pushes it to the registry.
  rpc CommitContainer(CommitContainerRequest) returns (CommitContainerResponse);

  // ConfirmQuiesced verifies that a quiesced capture is still valid and unexpired
  // before the controller deletes the source Pod.
  rpc ConfirmQuiesced(ConfirmQuiescedRequest) returns (ConfirmQuiescedResponse);

  // Health checks agent and containerd connectivity.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message CommitContainerRequest {
  string operation_id = 1;
  string workspace_uid = 2;
  string workspace_namespace = 3;
  string workspace_name = 4;
  string pod_name = 5;
  string pod_uid = 6;
  string container_name = 7;
  string container_id = 8;

  // Target repository (e.g. "registry.crema-system.svc:5000/workspaces/default-myws")
  // and tag (e.g. "rev-1").
  string target_repository = 9;
  string target_tag = 10;

  // Parent image reference currently running in the container.
  string parent_image_ref = 11;

  // Compression algorithm: "zstd" (default) or "gzip".
  string compression = 12;

  // Target registry transport & auth options.
  bool plain_http = 13;
  bool insecure_skip_tls_verify = 14;
  bytes docker_config_json = 15;

  // If true, keep the container task paused until Pod termination or watchdog deadline.
  // If false (e.g. manual snapshot), resume immediately after diff capture.
  bool keep_quiesced = 16;
  int64 quiescence_timeout_seconds = 17;
}

message CommitContainerResponse {
  // Immutable digest reference: "<target_repository>@sha256:..."
  string image_ref = 1;
  string image_digest = 2;

  // Incremental delta layer digest and compressed size in bytes.
  string layer_digest = 3;
  int64 layer_size_bytes = 4;

  // Compact diff summary extracted from delta tar headers.
  string diff_summary = 5;

  // True if the capture is valid (for keep_quiesced=true, task is still frozen and unexpired).
  bool capture_valid = 6;
  int64 quiescence_deadline_unix = 7;
}

message ConfirmQuiescedRequest {
  string operation_id = 1;
  string pod_uid = 2;
  string container_id = 3;
}

message ConfirmQuiescedResponse {
  bool valid = 1;
  string reason = 2;
  int64 quiescence_deadline_unix = 3;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string containerd_version = 2;
  string node_name = 3;
}
